name: Release Bump

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.2.3)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  detect:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      tag: ${{ steps.resolve.outputs.tag }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || github.sha) || github.event.workflow_run.head_sha }}

      - name: Resolve release tag
        id: resolve
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1 || true)"
          fi

          if [ -z "$TAG" ]; then
            echo "No release candidate found: no tag points to this commit."
            echo "reason=no-tag-found" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release skipped: tag '$TAG' is not valid semver (vX.Y.Z)."
            echo "reason=invalid-semver" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "reason=" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.detect.outputs.tag }}
    secrets: inherit
